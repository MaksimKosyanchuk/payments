name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: payments-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    lint:
        name: Repository lint and configuration checks
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npx prettier --check package.json docker-compose.yml .github/workflows/ci.yml scripts/integration-tests.mjs
            - run: node --check scripts/integration-tests.mjs
            - run: bash -n scripts/integration-smoke.sh
            - run: docker compose config --quiet
            - uses: hadolint/hadolint-action@v3.1.0
              with:
                  recursive: true
                  dockerfile: "**/Dockerfile"
            - uses: reviewdog/action-actionlint@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-pr-check
                  fail_level: error

    docker-smoke:
        name: Build and start complete Docker stack
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - run: docker compose up -d --build
            - run: bash scripts/integration-smoke.sh
            - if: always()
              run: docker compose ps -a
            - if: always()
              run: docker compose logs --no-color
            - if: always()
              run: docker compose down -v

    unit:
        name: Run all existing backend unit tests
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: |
                      package-lock.json
                      apps/ledger-service/package-lock.json
                      apps/payments-service/package-lock.json
                      apps/notifications-service/package-lock.json
            - run: npm ci
            - run: npm ci --prefix apps/ledger-service
            - run: npm ci --prefix apps/payments-service
            - run: npm ci --prefix apps/notifications-service
            - run: npm run prisma:generate --prefix apps/payments-service
            - run: npm run prisma:generate --prefix apps/notifications-service
            - run: npm run test:unit

    integration:
        name: Run Docker integration tests
        runs-on: ubuntu-latest
        needs: [lint]
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - uses: docker/setup-buildx-action@v3
            - run: docker compose up -d --build
            - run: npm run test:integration
            - run: bash scripts/integration-smoke.sh
            - if: always()
              run: docker compose ps -a
            - if: always()
              run: docker compose logs --no-color
            - if: always()
              run: docker compose down -v
