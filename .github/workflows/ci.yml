name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: payments-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    frontend:
        name: Frontend build and lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/frontend
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: apps/frontend/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    payments:
        name: Payments build, lint, and unit tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/payments-service
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: apps/payments-service/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test -- --runInBand

    ledger:
        name: Ledger build, lint, and unit tests
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/ledger-service
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: apps/ledger-service/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build
            - run: npm test -- --runInBand

    notifications:
        name: Notifications build and lint
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/notifications-service
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: apps/notifications-service/package-lock.json
            - run: npm ci
            - run: npm run lint
            - run: npm run build

    docker-build:
        name: Build all Docker images
        runs-on: ubuntu-latest
        needs: [frontend, payments, ledger, notifications]
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - run: docker compose build
            - run: docker compose config --quiet

    integration:
        name: Docker integration smoke tests
        runs-on: ubuntu-latest
        needs: [docker-build]
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - run: docker compose up -d --build
            - run: bash scripts/integration-smoke.sh
            - if: always()
              run: docker compose logs --no-color
            - if: always()
              run: docker compose down -v

    quality:
        name: Repository, compose, and Dockerfile lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
                  cache-dependency-path: package-lock.json
            - run: npm ci
            - run: npm run format:check
            - run: npx prettier --check docker-compose.yml .github/workflows/ci.yml
            - run: docker compose config --quiet
            - uses: hadolint/hadolint-action@v3.1.0
              with:
                  recursive: true
                  dockerfile: .
            - uses: reviewdog/action-actionlint@v1
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  reporter: github-pr-check
                  fail_level: error
