version: "3.8"

services:
    ledger-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ledger
            POSTGRES_PASSWORD: ledger
            POSTGRES_DB: ledger
        ports:
            - "5433:5432"
        volumes:
            - ledger-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
            interval: 5s
            timeout: 5s
            retries: 10

    payments-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: payments
            POSTGRES_PASSWORD: payments
            POSTGRES_DB: payments
        ports:
            - "5434:5432"
        volumes:
            - payments-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
            interval: 5s
            timeout: 5s
            retries: 10

    notifications-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: notifications
            POSTGRES_PASSWORD: notifications
            POSTGRES_DB: notifications
        ports:
            - "5435:5432"
        volumes:
            - notifications-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    ledger-service:
        build: ./apps/ledger-service
        env_file: ./apps/ledger-service/.env.example
        environment:
            DATABASE_HOST: ledger-db
            DATABASE_URL: postgresql://ledger:ledger@ledger-db:5432/ledger?schema=public
            REDIS_URL: redis://redis:6379
        depends_on:
            ledger-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3001:3001"

    payments-service:
        build: ./apps/payments-service
        env_file: ./apps/payments-service/.env.example
        environment:
            DATABASE_URL: postgresql://payments:payments@payments-db:5432/payments?schema=public
            LEDGER_SERVICE_URL: http://ledger-service:3001
            REDIS_URL: redis://redis:6379
        depends_on:
            payments-db:
                condition: service_healthy
            ledger-service:
                condition: service_started
            redis:
                condition: service_healthy
        ports:
            - "3002:3002"

    notifications-service:
        build: ./apps/notifications-service
        env_file: ./apps/notifications-service/.env.example
        environment:
            DATABASE_URL: postgresql://notifications:notifications@notifications-db:5432/notifications?schema=public
            REDIS_URL: redis://redis:6379
        depends_on:
            notifications-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3003:3003"

    frontend:
        build: ./apps/frontend
        env_file: ./apps/frontend/.env.example
        environment:
            LEDGER_SERVICE_URL: http://ledger-service:3001
            PAYMENTS_SERVICE_URL: http://payments-service:3002
            NOTIFICATIONS_WS_URL: ws://notifications-service:3003
        depends_on:
            - ledger-service
            - payments-service
            - notifications-service
        ports:
            - "3000:3000"

volumes:
    ledger-db-data:
    payments-db-data:
    notifications-db-data:
    redis-data:
