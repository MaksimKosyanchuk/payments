services:
    ledger-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: ledger
            POSTGRES_PASSWORD: ledger
            POSTGRES_DB: ledger
        ports:
            - "5433:5432"
        volumes:
            - ledger-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
            interval: 5s
            timeout: 5s
            retries: 10

    payments-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: payments
            POSTGRES_PASSWORD: payments
            POSTGRES_DB: payments
        ports:
            - "5434:5432"
        volumes:
            - payments-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U payments -d payments"]
            interval: 5s
            timeout: 5s
            retries: 10

    notifications-db:
        image: postgres:16-alpine
        environment:
            POSTGRES_USER: notifications
            POSTGRES_PASSWORD: notifications
            POSTGRES_DB: notifications
        ports:
            - "5435:5432"
        volumes:
            - notifications-db-data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U notifications -d notifications"]
            interval: 5s
            timeout: 5s
            retries: 10

    redis:
        image: redis:7-alpine
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 5s
            timeout: 3s
            retries: 10

    ledger-service:
        build: ./apps/ledger-service
        env_file: ./apps/ledger-service/.env.example
        environment:
            DATABASE_HOST: ledger-db
            DATABASE_PORT: 5432
            DATABASE_URL: postgresql://ledger:ledger@ledger-db:5432/ledger?schema=public
            REDIS_URL: redis://redis:6379
        depends_on:
            ledger-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3001:3001"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3001/metrics').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 15s

    payments-service:
        build: ./apps/payments-service
        env_file: ./apps/payments-service/.env.example
        environment:
            DATABASE_URL: postgresql://payments:payments@payments-db:5432/payments?schema=public
            LEDGER_SERVICE_URL: http://ledger-service:3001
            REDIS_URL: redis://redis:6379
            PAYMENTS_ADMIN_API_KEY: change-me-admin-trace-key
        depends_on:
            payments-db:
                condition: service_healthy
            ledger-service:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3002:3002"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3002/metrics').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    notifications-service:
        build: ./apps/notifications-service
        env_file: ./apps/notifications-service/.env.example
        environment:
            DATABASE_URL: postgresql://notifications:notifications@notifications-db:5432/notifications?schema=public
            REDIS_URL: redis://redis:6379
        depends_on:
            notifications-db:
                condition: service_healthy
            redis:
                condition: service_healthy
        ports:
            - "3003:3003"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

    frontend:
        build: ./apps/frontend
        env_file: ./apps/frontend/.env.example
        environment:
            LEDGER_SERVICE_URL: http://ledger-service:3001
            PAYMENTS_SERVICE_URL: http://payments-service:3002
            NOTIFICATIONS_WS_URL: ws://notifications-service:3003
            PAYMENTS_ADMIN_API_KEY: change-me-admin-trace-key
        depends_on:
            ledger-service:
                condition: service_healthy
            payments-service:
                condition: service_healthy
            notifications-service:
                condition: service_healthy
        ports:
            - "3000:3000"
        healthcheck:
            test:
                [
                    "CMD",
                    "node",
                    "-e",
                    "fetch('http://127.0.0.1:3000/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
                ]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s

volumes:
    ledger-db-data:
    payments-db-data:
    notifications-db-data:
    redis-data:
